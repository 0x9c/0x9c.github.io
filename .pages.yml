media:
  input: public/uploads
  output: /uploads
  rename: random
  categories: [image]

content:
  - name: posts
    label: 블로그 글
    type: collection
    path: src/content/blog
    filename: '{year}-{month}-{day}-{hour}-{minute}-{second}.md'
    view:
      primary: title
      fields: [title, pubDate]
      sort: [pubDate]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: description
        label: 글 소개
        description: 글 목록과 검색 결과에 표시되는 짧은 설명입니다.
        type: text
      - name: pubDate
        label: 작성일
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: cover
        label: 대표 사진
        type: image
      - name: coverAlt
        label: 대표 사진 설명
        description: 사진을 볼 수 없는 방문자를 위해 이미지의 내용을 설명해 주세요.
        type: string
      - name: gallery
        label: 사진 모음
        description: 여러 장의 사진을 함께 보여줍니다.
        type: image
        options:
          multiple: true
      - name: audioUrl
        label: 오디오 주소
        description: 직접 재생 가능한 오디오 파일의 HTTPS 주소를 입력합니다.
        type: string
      - name: draft
        label: 임시 저장
        description: 켜두면 사이트에 표시되지 않습니다.
        type: boolean
        default: false
      - name: body
        label: 본문
        type: rich-text

  - name: pages
    label: 소개 등 일반 페이지
    type: collection
    path: src/content/pages
    filename:
      template: '{primary}.md'
      field: create
    view:
      primary: title
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: description
        label: 페이지 소개
        type: text
      - name: body
        label: 본문
        type: rich-text

  - name: navigation
    label: 상단 메뉴
    type: file
    path: src/data/navigation.json
    fields:
      - name: items
        label: 메뉴 항목
        description: 항목을 추가하거나 순서를 변경하세요. 예를 들어 소개 페이지 주소는 /about/입니다.
        type: object
        list:
          collapsible:
            collapsed: false
            summary: '{label}'
        fields:
          - name: label
            label: 메뉴 이름
            type: string
            required: true
          - name: href
            label: 연결 주소
            description: 내부 페이지는 /about/처럼, 외부 페이지는 https://로 시작합니다.
            type: string
            required: true

  - name: site
    label: 블로그 기본 설정
    type: file
    path: src/data/site.json
    fields:
      - name: theme
        label: 블로그 테마
        description: '미리보기: https://blog.rom.kr/themes/ — 저장하면 새 테마가 자동 배포됩니다.'
        type: select
        required: true
        default: garden
        options:
          values:
            - name: garden
              label: 그린 저널 (기본)
            - name: paper
              label: 클래식 페이퍼
            - name: night
              label: 미드나이트
            - name: astro-blog
              label: Astro 공식 블로그
            - name: astro-paper
              label: AstroPaper
            - name: andromeda
              label: 안드로메다
      - name: title
        label: 블로그 이름
        type: string
        required: true
      - name: description
        label: 블로그 소개
        type: text
        required: true
      - name: headline
        label: 첫 화면 제목
        type: string
        required: true
      - name: introduction
        label: 첫 화면 소개
        type: text
        required: true
      - name: andromedaAvatar
        label: 안드로메다 프로필 사진
        type: image
      - name: andromedaBanner
        label: 안드로메다 배너 사진
        type: image
      - name: andromedaSidebarSide
        label: 안드로메다 사이드바 위치
        type: select
        default: left
        options:
          values:
            - name: left
              label: 왼쪽
            - name: right
              label: 오른쪽
      - name: andromedaPostWidth
        label: 안드로메다 글 너비
        type: select
        default: '500'
        options:
          values: ['400', '450', '500', '540']
      - name: andromedaFontSize
        label: 안드로메다 글자 크기 (px)
        type: number
        default: 15
        options:
          min: 14
          max: 24
      - name: andromedaFontFamily
        label: 안드로메다 글꼴
        type: select
        default: sans
        options:
          values:
            - name: sans
              label: 고딕
            - name: serif
              label: 명조
            - name: mono
              label: 고정폭
      - name: andromedaDetails
        label: 안드로메다 프로필 정보
        type: object
        list: true
        fields:
          - name: label
            label: 항목 이름
            type: string
          - name: value
            label: 내용
            type: string
